# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.30"
cache = true
cache_path = 'cache'
optimizer = true
optimizer_runs = 200
verbosity = 3
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 500 }

# CI fast path (every push / PR) -- same depth as the local default.
[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 500 }

# Alias referenced by `FOUNDRY_PROFILE=test forge fmt --check` in CI.
[profile.test]
fuzz = { runs = 256 }

# Used by the CI test job -- deeper fuzzing / invariants.
[profile.medium]
fuzz = { runs = 1000 }
invariant = { runs = 512, depth = 500 }

# On-demand thorough run (workflow_dispatch / pre-release).
[profile.intense]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 1000 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
func_attrs_with_params_multiline = true
quote_style = 'double'
number_underscore = 'preserve'
multiline_func_header = 'params_first'

{% if cookiecutter.use_tenderly == 'y' %}
[etherscan]
 
## placeholders must be replaced with key ("string"), chain_id (number, non-quoted), and tenderly_foundry_verification_url ("string")
unknown_chain = { key = "$TENDERLY_ACCESS_KEY", chain = 0, url = "$TENDERLY_FOUNDRY_VERIFICATION_URL" }
{% endif %}